unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -L
bind-key q detach-client

bind-key s choose-tree -Zs -F "#{?pane_format,#[fg=#{@thm_blue}]#{pane_current_command} #[fg=#{@thm_overlay_1}]#{b:pane_current_path},#{?window_format,#[fg=#{@thm_fg}]#{window_name} #[fg=#{@thm_overlay_1}]#{?#{>:#{window_panes},1},#{window_panes} panes,},#[fg=#{@thm_green}]#{session_windows} window#{?#{>:#{session_windows},1},s,}#{?session_attached,#[fg=#{@thm_peach}] attached,}}}"

set-option -g status-position top
set-option history-limit 5000

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

#fix color
set -as terminal-features ",xterm-256color:RGB"

# Captppuccin config
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_session_text ""
set -g @catppuccin_status_session_text_bg "#{?client_prefix,#{@thm_red},#{@thm_green}}"

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
set -g status-right-length 100

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

